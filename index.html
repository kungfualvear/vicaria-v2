<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>ViCaRiA - Vigía de Caudales del Río Atuel</title>
  <link rel="stylesheet" href="vicaria.css">
  <meta name="theme-color" content="#000000">
<script src="https://cdn.jsdelivr.net/npm/chart.js@3.7.1/dist/chart.min.js"></script>
</head>
<body>
  <div class="header">
    <h1></h1>
    <div class="topbar-m">
      <div>
        <div class="brand-m">ViCaRiA <span>· Atuel</span></div>
        <div class="upd-m" id="lastUpdated">Cargando…</div>
      </div>
      <button type="button" class="ib-m" id="refreshBtnTop" aria-label="Actualizar datos">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
      </button>
    </div>
  </div>

  <aside class="side-panel" id="sidePanel" aria-label="Menú">
    <button class="panel-tab" id="panelToggle" type="button"
            title="Mostrar/ocultar menú" aria-controls="sidePanel" aria-expanded="true">▶</button>

    <div class="filter-group">
      <button class="filter-btn" data-filter="all" title="Todos"><span class="fi-d">📊</span><svg class="fi-m" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg><span class="fl">Todos</span></button>
      <button class="filter-btn active" data-filter="favorites" title="Favoritos"><span class="fi-d">⭐</span><svg class="fi-m" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-2.9-5.4 2.9 1.1-6L3.2 9.4l6.1-.8z"/></svg><span class="fl">Favoritos</span></button>
      <button class="filter-btn" data-filter="alarm" title="Alarmas"><span class="fi-d">🔔</span><svg class="fi-m" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 17V11a6 6 0 1 1 12 0v6l2 2H4z"/><path d="M10 21h4"/></svg><span class="fl">Alarmas</span></button>
      <button class="filter-btn" id="manageBtn" title="Códigos"><span class="fi-d">⚙️</span><svg class="fi-m" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg><span class="fl">Códigos</span></button>
      <button class="filter-btn success" id="refreshBtn" title="Actualizar">⟳</button>
    </div>
  </aside>

  <div id="cardsGrid" class="cards-grid"></div>

  <div class="loading" id="initialLoading">
    Cargando códigos disponibles...
  </div>

  <div class="empty-state" id="emptyState" style="display: none;">
    <h2>📭 No hay códigos seleccionados</h2>
    <p>Haz clic en "Gestionar Códigos" para agregar tarjetas de monitoreo</p>
    <button class="btn" onclick="document.getElementById('manageBtn').click()">
      ➕ Agregar Códigos
    </button>
  </div>

  <div class="modal" id="selectorModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Gestionar Códigos</h2>
        <button class="close-btn" id="closeModal">✕</button>
      </div>
      
      <div class="modal-body">
        <input type="text" id="modalSearch" class="modal-search" placeholder="🔍 Buscar código o nombre...">
        <div class="code-list" id="codeList"></div>
      </div>

      <div class="modal-footer">
        <button class="btn" style="flex: 1;" id="saveSelection">💾 Guardar Selección</button>
      </div>
    </div>
  </div>
  
<div class="modal" id="historyModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="historyModalTitle">Historial de Datos</h2>
		
        <div style="display: flex; gap: 15px; align-items: center;">
            
            <button class="close-btn" id="closeHistoryModal">✕</button>
        </div>
      </div>
      
      <div class="modal-body">
        <div class="time-filter">
            <label>Mostrar últimas:</label>
            <select id="timeRangeSelect">
			    <option value="2">2 Horas</option>
                <option value="4" selected>4 Horas</option>
                <option value="8">8 Horas</option>
                <option value="12">12 Horas</option>
                <option value="24">24 Horas</option>
				<option value="48">48 Horas</option>
            </select>
            <div class="hour-chips" id="hourChips"><button type="button" data-h="2">2 h</button><button type="button" data-h="4">4 h</button><button type="button" data-h="8">8 h</button><button type="button" data-h="12">12 h</button><button type="button" data-h="24">24 h</button><button type="button" data-h="48">48 h</button></div>
            <button class="btn" id="updateChartBtn">Actualizar Gráfico</button>
        </div>
        <div class="time-filter range-filter">
            <div class="fld"><label for="rangeStart">Desde:</label>
            <input type="datetime-local" id="rangeStart"></div>
            <div class="fld"><label for="rangeEnd">Hasta:</label>
            <input type="datetime-local" id="rangeEnd"></div>
            <button class="btn" id="applyRangeBtn">Ver rango</button>
            <span id="rangeMessage" class="range-message"></span>
        </div>
        <div class="chart-container">
            <canvas id="historyChart"></canvas>
            <div id="chartLoading" class="loading" style="display:none; color:#333;">Cargando gráfico...</div>
        </div>
        <div id="historyTableContainer" class="history-table-container">
            </div>
      </div>

      <div class="modal-footer">
        <button class="btn" id="csvBtn" style="flex: 1; border-color:#4CAF50; color:#4CAF50;" onclick="downloadHistoryCSV(currentHistoryCode)">⬇️ Descargar CSV</button>
        <button class="btn" id="closeHistoryModalFooter" style="flex: 1;">Cerrar</button>
      </div>
    </div>
  </div>
  
  <div class="modal" id="settingsModal">
      <div class="modal-content">
          <div class="modal-header">
              <h2>Configuración</h2>
              <button class="close-btn" id="closeSettingsModal">✕</button>
          </div>
          <div class="modal-body">
              <div class="setting-item"> 
                 
                  <input type="checkbox" id="useAdjustValue">
              </div>
              <div class="setting-item"> 
                  <label for="globalAdjustValue">Global (m³/s):</label> 
                  <input type="number" step="0.01" id="globalAdjustValue" placeholder="Ej: 0.50">
              </div>
          </div>
          <div class="modal-footer">
              <button class="btn" id="closeSettingsModalFooter" style="flex: 1;">Cerrar</button>
          </div>
      </div>
  </div>
  <script src="vicaria-sheet.js"></script>
  <script src="vicaria.js"></script>
  
  <script>
  /*
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/service-worker.js')
      .then(() => console.log('SW registered'))
      .catch(e => console.error('SW reg fail', e));
  }
  */
</script>

<div id="modalManual" class="modal-bg">
  <div class="modal-content">
    <button id="closeManual" class="close-btn">✖</button>
    <iframe src="manual.html" class="manual-frame"></iframe>
  </div>
</div>

  
</body>
</html>
